name: Build dist

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check types
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ai-site-mask-dist-${{ github.sha }}
          path: dist/chromium/
          if-no-files-found: error
          retention-days: 30
