name: Release dist

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check types
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Package extension
        working-directory: dist/chromium
        run: zip -r "../../ai-site-mask-${GITHUB_REF_NAME}.zip" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ai-site-mask-${GITHUB_REF_NAME}.zip" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
